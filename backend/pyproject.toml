[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-estate-planning"
version = "0.1.0"
description = "Bitcoin Estate Planning Platform - MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",  # Required for SQLAlchemy async operations
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",  # For Alembic migrations
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "base58>=2.1.0",  # Bitcoin address validation (Base58)
    "bech32>=1.2.0",  # Bitcoin address validation (Bech32/SegWit)
    "fastapi-users[sqlalchemy]>=12.0.0",  # User authentication and management
    "httpx>=0.27.0",  # HTTP client for FastAPI Users
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "pyright>=1.1.370",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

